apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n

  template:
    metadata:
      labels:
        app: n8n

    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000

      containers:
        - name: n8n
          image: docker.io/n8nio/n8n:2.39.6

          ports:
            - containerPort: 3008
              protocal: TCP

          fromEnv:
            - configMapRef:
              name: n8n-configmap

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n

      restartPolicy: Always

      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
