apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer1-n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer1-n8n
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: customer1-n8n

    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000

      containers:
        - name: n8n
          image: docker.io/n8nio/n8n:2.39.6

          ports:
            - containerPort: 3008
              protocal: TCP

          fromEnv:
            - configMapRef:
              name: customer1-n8n-config
            - secretRef:
              name: customer1-n8n-env

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true

      restartPolicy: Always

      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: customer1-n8n-data
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: customer1-secrets
